:650;box-shadow:var(--shadow);transform:translateY(16px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:none;opacity:1}.collapsed .left{display:none}.collapsed .workspace{grid-template-columns:minmax(460px,1fr) 286px}

    .workspace{grid-template-columns:286px minmax(0,1fr)}.center{grid-template-rows:minmax(0,1fr) 164px}

<body>
<main class="app">
  <header class="topbar"><div class="brand"><div class="logo">⌁</div><div><strong>IteraLIO</strong><span style="color:#5f6e7c"> / Web</span></div></div><div class="project"><span class="project-name">实时扫描工作台</span><span class="tag" id="connectionTag">连接中</span></div><div class="top-actions"><button class="primary-btn" id="savePcdBtn" title="保存当前扫描结果到 LIO 运行目录">保存点云</button><button class="ghost-btn" id="saveBtn" title="保存当前画面为 PNG">保存视图</button></div></header>
  <section class="workspace">
    <aside class="left">
      <div class="section"><div class="section-title">实时数据</div><div class="metric-grid"><div class="metric"><div class="metric-label">扫描时长</div><div class="metric-value" id="scanDuration">—</div></div><div class="metric"><div class="metric-label">累积里程</div><div class="metric-value" id="distance">—</div></div><div class="metric"><div class="metric-label">平移速度</div><div class="metric-value" id="speed">—</div></div><div class="metric" title="后端彩色地图归档总点数，不受 Web 预览采样限制"><div class="metric-label">彩色地图点数</div><div class="metric-value" id="pointCount">—</div></div></div></div><div class="section"><div class="section-title">当前位置</div><div class="empty" id="poseText">等待 /lio/odom</div></div><div class="section"><div class="section-title">连接详情</div><div class="status-list"><div class="status-row"><span class="status-name">WebSocket</span><span></span><span class="status-num" id="wsStatus">连接中</span></div><div class="status-row"><span class="status-name">点云</span><span></span><span class="status-num" id="cloudStatus">等待数据</span></div><div class="status-row"><span class="status-name">里程计</span><span></span><span class="status-num" id="odomStatus">等待数据</span></div></div></div>
      <div class="section"><div class="section-title">显示设置</div><div class="field"><div class="label-row"><label for="colorMode">点云着色</label></div><select class="select" id="colorMode"><option value="height">高度渐变</option><option value="rgb">原始颜色</option></select></div><div class="field"><div class="label-row"><label for="pointSize">点大小</label><span class="value" id="pointSizeVal">1 px</span></div><input class="slider" id="pointSize" type="range" min="1" max="8" value="1"></div><div class="toggle-row"><span>显示坐标网格</span><label class="switch"><input id="gridToggle" type="checkbox"><span></span></label></div><div class="hint"><span>左键旋转，中键平移，右键上下拖动或滚轮缩放；双击或点击 ⌂ 复位视角。</span></div></div>
    </aside>
    <section class="center"><div class="viewer"><canvas id="cloud"></canvas><div class="view-top"><label class="view-toggle" for="trajectoryToggle"><span>显示轨迹</span><span class="switch"><input id="trajectoryToggle" type="checkbox" checked><span></span></span></label><div class="view-tools"><button class="icon-btn" id="homeView" title="复位视角">⌂</button><button class="icon-btn" id="gridBtn" title="切换网格" aria-pressed="false">#</button><button class="icon-btn" id="fullBtn" title="全屏">⛶</button></div></div><div class="live-pill"><span class="pulse"></span><span id="liveText">连接中…</span></div><div class="axis"><canvas id="axisCanvas" width="72" height="72" role="img" aria-label="随视角旋转的 X Y Z 坐标轴"></canvas></div></div>
      <div class="timeline"><div class="chart-wrap"><div class="chart-head"><span class="chart-title" title="浏览器收到的概览点云快照速率，不是雷达采集帧率">点云接收速率</span><div class="rate-stats"><span>当前 <b id="rateNow">—</b> Hz</span><span>近 10 帧均值 <b id="rateAverage">—</b> Hz</span></div></div><canvas id="rateChart" role="img" aria-label="点云接收速率趋势及近十帧均值"></canvas></div><div class="events"><div class="chart-title">连接状态</div><div class="event"><span class="event-icon">●</span><span class="event-copy" id="eventText">等待 WebSocket 连接</span></div><div class="event"><span class="event-copy" id="frameInfo">等待点云帧</span></div></div></div>
    </section>

  </section><footer class="footer"><span id="footerConnection">● 连接中</span><span id="footerTopic">ROS 2</span><span class="right-foot" id="footerTime">等待点云</span></footer>
</main>
<script>
const $=s=>document.querySelector(s);
const integer=n=>Math.trunc(n).toLocaleString('en-US');
const oneDecimal=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
function durationText(seconds){let n=Math.floor(Math.max(0,seconds));return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')}
const canvas=$('#cloud'),gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
let count=0,origin=[0,0,0],scale=1,yaw=0,pitch=0,dist=35,panX=0,panY=0,dragButton=-1,lx=0,ly=0,grid=false;
let lastFrameAt=0,lastCloudAt=0,lastOdomAt=0,trajectory=[],pose=null,rateHistory=[],cloudTopic='/lio/global_map',focus=[0,0,0],gridHeight=0,autoFollow=true;
if(!gl){$('#liveText').textContent='浏览器不支持 WebGL';throw Error('WebGL unavailable')}
const vs=`attribute vec3 p;attribute vec3 c;uniform mat4 m;uniform vec3 center;uniform float pointSize;varying vec3 v;void main(){gl_Position=m*vec4(p-center,1.);gl_PointSize=pointSize;v=c;}`;
const fs=`precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
let pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,vs));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
let pb=gl.createBuffer(),cb=gl.createBuffer(),hb=gl.createBuffer(),gb=gl.createBuffer();
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);if(canvas.width!==Math.round(r.width*d)||canvas.height!==Math.round(r.height*d)){canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);gl.viewport(0,0,canvas.width,canvas.height)}}
canvas.oncontextmenu=e=>e.preventDefault();
canvas.onpointerdown=e=>{if(e.button>2)return;e.preventDefault();autoFollow=false;dragButton=e.button;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};
canvas.onpointerup=()=>dragButton=-1;canvas.onpointercancel=()=>dragButton=-1;
canvas.onpointermove=e=>{if(dragButton<0)return;let dx=e.clientX-lx,dy=e.clientY-ly;if(dragButton===0){yaw-=dx*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.008))}else if(dragButton===1){let metresPerPixel=2*dist*Math.tan(.5)/Math.max(1,canvas.clientHeight);panX+=dx*metresPerPixel;panY-=dy*metresPerPixel}else if(dragButton===2){dist=Math.max(2,Math.min(300,dist*Math.exp(dy*.01)))}lx=e.clientX;ly=e.clientY;detailDirty=true};
canvas.onwheel=e=>{e.preventDefault();autoFollow=false;dist=Math.max(2,Math.min(300,dist*Math.exp(e.deltaY*.001)));detailDirty=true};canvas.ondblclick=resetView;
function resetView(){yaw=0;pitch=0;dist=35;panX=0;panY=0;autoFollow=true;detailDirty=true}
function matrix(){let a=canvas.width/Math.max(1,canvas.height),f=1/Math.tan(.5),z=.01,far=1000,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let p=[f/a,0,0,0,0,f,0,0,0,0,(far+z)/(z-far),-1,0,0,2*far*z/(z-far),0];let r=[sy,sp*cy,-cp*cy,0,-cy,sp*sy,-cp*sy,0,0,cp,sp,0,panX,panY,-dist,1],m=new Float32Array(16);for(let row=0;row<4;row++)for(let col=0;col<4;col++)m[col*4+row]=p[row]*r[col*4]+p[row+4]*r[col*4+1]+p[row+8]*r[col*4+2]+p[row+12]*r[col*4+3];return m}
const axisCanvas=$('#axisCanvas'),axisCtx=axisCanvas.getContext('2d');
function drawAxis(){
  const size=72,d=Math.min(devicePixelRatio,2);
  if(axisCanvas.width!==size*d||axisCanvas.height!==size*d){axisCanvas.width=size*d;axisCanvas.height=size*d;axisCtx.setTransform(d,0,0,d,0,0)}
  axisCtx.clearRect(0,0,size,size);
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const axes=[{name:'X',x:sy,y:sp*cy,depth:-cp*cy,color:'#ee7270'},
              {name:'Y',x:-cy,y:sp*sy,depth:-cp*sy,color:'#65d593'},
              {name:'Z',x:0,y:cp,depth:sp,color:'#63aef2'}];
  const center=size/2,length=22;
  axes.sort((a,b)=>a.depth-b.depth);
  axisCtx.lineWidth=2.5;axisCtx.lineCap='round';axisCtx.font='bold 11px system-ui,sans-serif';
  for(const axis of axes){
    const x=center+axis.x*length,y=center-axis.y*length;
    axisCtx.strokeStyle=axis.color;axisCtx.fillStyle=axis.color;
    axisCtx.beginPath();axisCtx.moveTo(center,center);axisCtx.lineTo(x,y);axisCtx.stroke();
    axisCtx.beginPath();axisCtx.arc(x,y,2.5,0,Math.PI*2);axisCtx.fill();
    axisCtx.fillText(axis.name,x+4,y-4);
  }
