# Web point-cloud display and connection settings. These do not change SLAM registration.
lio_web_server:
  ros__parameters:
    pointcloud_topic: /lio/global_map
    fallback_pointcloud_topic: /lio/cloud_colored
    odometry_topic: /lio/odom
    # Web 轨迹最多发送的点数；超限时逐步抽稀旧轨迹，保留近期细节。
    trajectory_max_points: 200000
    bind_host: 0.0.0.0
    port: 8765
    max_points: 200000
    rate_hz: 1.0
    voxel_size: 0.05
